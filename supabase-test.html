
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIFTS Supabase Security Test</title>
</head>
<body>
  <h1>LIFTS Supabase Test</h1>

  <p>Enter your Supabase project details and temporary test accounts.</p>

  <label>Project URL</label><br>
  <input id="url" style="width:95%"
    value="https://msnoktushqwadtknxrij.supabase.co"><br><br>

  <label>Publishable key</label><br>
  <input id="key" type="password" style="width:95%"><br><br>

  <h3>Test user A</h3>
  <input id="emailA" placeholder="User A email"><br><br>
  <input id="passA" type="password" placeholder="User A password"><br><br>
  <input id="uuidA" placeholder="User A UUID" style="width:95%"><br><br>

  <h3>Test user B</h3>
  <input id="emailB" placeholder="User B email"><br><br>
  <input id="passB" type="password" placeholder="User B password"><br><br>
  <input id="uuidB" placeholder="User B UUID" style="width:95%"><br><br>

  <button id="run">Run security tests</button>
  <pre id="output">Waiting to run tests...</pre>

  <script type="module">
    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    const $ = id => document.getElementById(id);
    const log = message => {
      $('output').textContent += '\n' + message;
    };

    $('run').addEventListener('click', async () => {
      $('output').textContent = 'Starting tests...';

      const url = $('url').value.trim();
      const key = $('key').value.trim();
      const idA = $('uuidA').value.trim();
      const idB = $('uuidB').value.trim();

      if (!url || !key || !idA || !idB || idA === idB) {
        log('FAIL: Check project details and both different UUIDs.');
        return;
      }

      const a = createClient(url, key, {
        auth: { storageKey: 'lifts-test-user-a' }
      });
      const b = createClient(url, key, {
        auth: { storageKey: 'lifts-test-user-b' }
      });

      try {
        const loginA = await a.auth.signInWithPassword({
          email: $('emailA').value.trim(),
          password: $('passA').value
        });
        if (loginA.error) throw new Error('User A sign-in failed: ' + loginA.error.message);
        if (loginA.data.user.id !== idA) {
          throw new Error('User A UUID does not match the signed-in account.');
        }
        log('PASS: User A signed in.');

        const loginB = await b.auth.signInWithPassword({
          email: $('emailB').value.trim(),
          password: $('passB').value
        });
        if (loginB.error) throw new Error('User B sign-in failed: ' + loginB.error.message);
        if (loginB.data.user.id !== idB) {
          throw new Error('User B UUID does not match the signed-in account.');
        }
        log('PASS: User B signed in.');

        // Prepare harmless test rows for these temporary accounts.
        for (const [client, id, label] of [
          [a, idA, 'A'],
          [b, idB, 'B']
        ]) {
          const result = await client.from('user_data').upsert({
            user_id: id,
            payload: { security_test: 'LIFTS temporary test ' + label }
          });
          if (result.error) throw new Error('Preparing test row ' + label + ' failed: ' + result.error.message);
        }
        log('PASS: Each test account can save its own row.');

        const own = await a.from('user_data')
          .select('user_id').eq('user_id', idA);
        if (own.error) throw own.error;
        if (own.data.length !== 1) throw new Error('User A could not read its own row.');
        log('PASS: User A can read its own row.');

        const other = await a.from('user_data')
          .select('user_id').eq('user_id', idB);
        if (other.error) throw other.error;
        if (other.data.length !== 0) throw new Error('FAIL: User A can read User B data.');
        log('PASS: User A cannot read User B row.');

        const update = await a.from('user_data')
          .update({ payload: { security_test: 'UNAUTHORIZED CHANGE' } })
          .eq('user_id', idB).select('user_id');
        if (update.error) throw update.error;
        if (update.data.length !== 0) throw new Error('FAIL: User A modified User B row.');
        log('PASS: User A cannot modify User B row.');

        const verifyB = await b.from('user_data')
          .select('payload').eq('user_id', idB).single();
        if (verifyB.error) throw verifyB.error;
        if (verifyB.data.payload.security_test !== 'LIFTS temporary test B') {
          throw new Error('FAIL: User B test data changed unexpectedly.');
        }
        log('PASS: User B data remains unchanged.');
        log('\nALL API READ/UPDATE TESTS PASSED.');
      } catch (error) {
        log('\nTEST STOPPED: ' + error.message);
      } finally {
        await a.auth.signOut();
        await b.auth.signOut();
      }
    });
  </script>
</body>
</html>
